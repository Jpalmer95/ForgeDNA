[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgedna"
version = "1.0.0"
description = "CLI tool for creating, validating, and managing ForgeDNA game design files."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "jsonschema>=4.20.0",
    "rich>=13.0.0",
    "deepdiff>=6.7.0",
]

[project.scripts]
forgedna = "forgedna.cli:app"

[tool.setuptools.packages.find]
include = ["forgedna*"]
