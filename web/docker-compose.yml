services:
  forgedna-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgedna
      POSTGRES_PASSWORD: forgedna_secret
      POSTGRES_DB: forgedna
    volumes:
      - forgedna-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgedna"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forgedna

  forgedna-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      forgedna-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://forgedna:***@forgedna-db:5432/forgedna
    networks:
      - forgedna

volumes:
  forgedna-pgdata:

networks:
  forgedna:
    driver: bridge
